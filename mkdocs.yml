    - Janus Protocol: janus-protocol.md
    - Ghost Gate Spec: ghost-gate-spec.md
    - RIN — Real Intelligence Network: rin.md
    - Boot Protocol: nexus-boot-protocol.md
    - NeXuS Rings: nexus-rings.md

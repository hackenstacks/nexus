site_name: NeXuS Wiki
site_description: Sane • Simple • Secure • Stealthy • Beautiful — Together Everyone Achieves More
site_author: The NeXuS Collective
site_url: https://hackenstacks.github.io/nexus/
repo_url: https://github.com/hackenstacks/nexus
repo_name: hackenstacks/nexus
docs_dir: docs

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: cyan
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
    home: material/home
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - header.autohide

extra:
  nexus_version: beta-v1
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hackenstacks/nexus
      name: NeXuS on GitHub
  homepage: https://hackenstacks.github.io/nexus/

extra_css:
  - assets/wiki.css

